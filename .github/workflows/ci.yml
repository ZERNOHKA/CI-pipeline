name: Первый конвейер CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Установить зависимости
        run: npm install

      - name: Запустить тесты
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Создать ZIP архив
        run: zip -r weather-report-app.zip . -x "*.git*" "node_modules/*"

      - name: Сохранить ZIP как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: weather-report-app
          path: weather-report-app.zip
          retention-days: 7
